name: Build OxideESP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract zip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          echo "Found: $ZIP"
          unzip -o "$ZIP" -d /tmp/proj
          INNER=$(find /tmp/proj -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -n "$INNER" ]; then
            cp -r "$INNER"/. .
          else
            cp -r /tmp/proj/. .
          fi

      - name: Fix Gradle wrapper
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew" \
            -o gradlew
          chmod +x gradlew
          python3 - <<'PYEOF'
import urllib.request, zipfile, io, sys
url = "https://services.gradle.org/distributions/gradle-8.4-bin.zip"
print("Downloading Gradle distribution...")
data = urllib.request.urlopen(url).read()
z = zipfile.ZipFile(io.BytesIO(data))
for name in z.namelist():
    if name.endswith("gradle-wrapper.jar"):
        with open("gradle/wrapper/gradle-wrapper.jar", "wb") as f:
            f.write(z.read(name))
        print("Installed:", name)
        sys.exit(0)
sys.exit(1)
PYEOF

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OxideESP-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
