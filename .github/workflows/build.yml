name: Build OxideESP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract zip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          echo "Found: $ZIP"
          unzip -o "$ZIP" -d /tmp/proj
          INNER=$(find /tmp/proj -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -n "$INNER" ]; then
            cp -r "$INNER"/. .
          else
            cp -r /tmp/proj/. .
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Fix gradlew
        run: |
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew" -o gradlew
          chmod +x gradlew

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -alias androiddebugkey -keypass android -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
        working-directory: .

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OxideESP-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
